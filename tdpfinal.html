<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Türkiye Dış Politikası Sınavı</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --card2: #F9F9FB;
    --primary: #007AFF;
    --primary-light: #E8F1FF;
    --green: #34C759;
    --green-light: #E8FAE8;
    --red: #FF3B30;
    --red-light: #FFECEB;
    --orange: #FF9500;
    --purple: #AF52DE;
    --label: #1C1C1E;
    --label2: #3A3A3C;
    --label3: #636366;
    --label4: #8E8E93;
    --separator: #E5E5EA;
    --separator2: #C6C6C8;
    --blur: rgba(242,242,247,0.85);
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--label);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── HOME SCREEN ── */
  #home {
    background: linear-gradient(160deg, #1C3A6E 0%, #0A1929 55%, #0F2A4A 100%);
    position: relative; overflow: hidden;
  }
  #home::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(0,122,255,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 75% 75%, rgba(175,82,222,0.2) 0%, transparent 55%);
    pointer-events: none;
  }
  .home-header {
    padding: 70px 28px 0;
    position: relative; z-index: 1;
  }
  .home-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px; padding: 5px 12px; margin-bottom: 22px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .home-badge span { font-size: 14px; }
  .home-title {
    font-size: 36px; font-weight: 700; color: #fff;
    line-height: 1.15; margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .home-title em { color: #5AC8FA; font-style: normal; }
  .home-subtitle {
    font-size: 16px; color: rgba(255,255,255,0.65);
    line-height: 1.5; margin-bottom: 36px;
  }
  .periods-label {
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
  }
  .period-cards {
    display: flex; flex-direction: column; gap: 10px;
    padding: 0 28px 28px;
    position: relative; z-index: 1;
    flex: 1; overflow-y: auto;
  }
  .period-card {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex; align-items: center; gap: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative; overflow: hidden;
  }
  .period-card::after {
    content: '›';
    position: absolute; right: 18px;
    font-size: 22px; color: rgba(255,255,255,0.35);
    font-weight: 300;
  }
  .period-card:active { transform: scale(0.97); background: rgba(255,255,255,0.14); }
  .period-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .period-info { flex: 1; }
  .period-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .period-count { font-size: 13px; color: rgba(255,255,255,0.5); }
  .all-card {
    background: linear-gradient(135deg, #007AFF, #5856D6);
    border: none;
  }
  .all-card .period-name { color: #fff; }

  /* ── QUIZ SCREEN ── */
  #quiz { background: var(--bg); }

  .quiz-navbar {
    background: var(--blur);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--separator);
    padding: 12px 20px 10px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-back {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--primary-light); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--primary); font-size: 16px;
    transition: all 0.15s; flex-shrink: 0;
  }
  .nav-back:active { transform: scale(0.9); }
  .nav-info { flex: 1; }
  .nav-period { font-size: 13px; font-weight: 600; color: var(--label); }
  .nav-progress-text { font-size: 11px; color: var(--label4); margin-top: 1px; }
  .nav-score-badge {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px; font-weight: 700;
    padding: 5px 10px; border-radius: 20px;
    flex-shrink: 0;
  }

  .progress-bar-wrap {
    height: 4px; background: var(--separator);
    position: relative;
  }
  .progress-bar-fill {
    height: 100%; background: var(--primary);
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    border-radius: 0 2px 2px 0;
  }

  .quiz-body {
    padding: 20px 20px 100px;
    flex: 1;
    overflow-y: auto;
  }

  .q-number-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .q-number {
    font-size: 12px; font-weight: 700; color: var(--primary);
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--primary-light); padding: 4px 10px; border-radius: 20px;
  }
  .q-period-tag {
    font-size: 11px; color: var(--label4);
    background: var(--separator); padding: 4px 10px; border-radius: 20px;
  }

  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-card);
  }
  .question-text {
    font-size: 16px; font-weight: 500;
    color: var(--label); line-height: 1.55;
  }

  .options-list { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    background: var(--card);
    border: 1.5px solid var(--separator);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-card);
    text-align: left;
    -webkit-appearance: none;
    width: 100%;
  }
  .option-btn:active:not([disabled]) { transform: scale(0.98); }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .option-text {
    font-size: 14px; color: var(--label2);
    line-height: 1.4; flex: 1;
    font-weight: 400;
  }
  .option-icon {
    font-size: 16px; flex-shrink: 0; opacity: 0;
    transition: opacity 0.15s;
  }

  /* States */
  .option-btn.correct {
    background: var(--green-light);
    border-color: var(--green);
  }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.correct .option-text { color: #1a5c2a; font-weight: 500; }
  .option-btn.correct .option-icon { opacity: 1; }

  .option-btn.wrong {
    background: var(--red-light);
    border-color: var(--red);
  }
  .option-btn.wrong .option-letter { background: var(--red); color: #fff; }
  .option-btn.wrong .option-text { color: #7a1f1a; font-weight: 500; }
  .option-btn.wrong .option-icon { opacity: 1; }

  .option-btn.dimmed { opacity: 0.4; }
  .option-btn[disabled] { cursor: default; pointer-events: none; }

  /* Explanation */
  .explanation-card {
    background: var(--card2);
    border: 1.5px solid var(--separator);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-top: 14px;
    display: none;
    animation: slideIn 0.25s ease;
  }
  .explanation-card.show { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .explanation-label {
    font-size: 11px; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .explanation-text {
    font-size: 13px; color: var(--label3); line-height: 1.5;
  }

  /* Next button */
  .next-btn-wrap {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 16px 20px 32px;
    background: var(--blur);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--separator);
    z-index: 50;
  }
  .next-btn {
    width: 100%; padding: 16px;
    background: var(--primary);
    color: #fff; font-size: 16px; font-weight: 600;
    border: none; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.98); background: #0064d6; }

  /* ── RESULT SCREEN ── */
  #result { background: var(--bg); }

  .result-header {
    background: linear-gradient(160deg, #1C3A6E 0%, #0A1929 100%);
    padding: 60px 28px 40px;
    text-align: center; position: relative; overflow: hidden;
  }
  .result-header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(0,122,255,0.35) 0%, transparent 70%);
  }
  .result-emoji { font-size: 56px; margin-bottom: 16px; position: relative; }
  .result-title {
    font-size: 26px; font-weight: 700; color: #fff;
    margin-bottom: 6px; position: relative;
  }
  .result-subtitle {
    font-size: 15px; color: rgba(255,255,255,0.6);
    position: relative;
  }

  .result-score-row {
    display: flex; gap: 12px;
    padding: 20px 20px 0;
  }
  .score-box {
    flex: 1; background: var(--card);
    border-radius: var(--radius); padding: 18px 16px;
    text-align: center; box-shadow: var(--shadow-card);
  }
  .score-box-val {
    font-size: 28px; font-weight: 700; color: var(--label);
    margin-bottom: 4px;
  }
  .score-box-label { font-size: 12px; color: var(--label4); font-weight: 500; }
  .score-pct { color: var(--primary); }
  .score-correct { color: var(--green); }
  .score-wrong { color: var(--red); }

  .result-actions {
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .btn-primary {
    width: 100%; padding: 16px;
    background: var(--primary); color: #fff;
    font-size: 16px; font-weight: 600;
    border: none; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%; padding: 16px;
    background: var(--card); color: var(--primary);
    font-size: 16px; font-weight: 600;
    border: 1.5px solid var(--separator);
    border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s;
  }
  .btn-secondary:active { transform: scale(0.98); }

  .review-list { padding: 0 20px 40px; }
  .review-header {
    font-size: 11px; font-weight: 700; color: var(--label4);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 20px 0 12px;
  }
  .review-item {
    background: var(--card); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: flex-start; gap: 12px;
    box-shadow: var(--shadow-card);
  }
  .review-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .review-q { font-size: 13px; color: var(--label2); line-height: 1.4; flex: 1; }
  .review-ans {
    font-size: 12px; margin-top: 4px; font-weight: 500;
  }
  .review-ans.ok { color: var(--green); }
  .review-ans.no { color: var(--red); }

  /* Animations */
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.92) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .question-card { animation: popIn 0.25s ease; }
</style>
</head>
<body>

<!-- ═══════════════ HOME SCREEN ═══════════════ -->
<div id="home" class="screen active">
  <div class="home-header">
    <div class="home-badge"><span>🇹🇷</span> Çalışma Kartları</div>
    <div class="home-title">Türkiye <em>Dış Politikası</em></div>
    <div class="home-subtitle">1950–1990 arası önemli gelişmeleri test et. Her soruda şıklar rastgele karışır.</div>
    <div class="periods-label">Dönem Seç</div>
  </div>
  <div class="period-cards" id="periodCards"></div>
</div>

<!-- ═══════════════ QUIZ SCREEN ═══════════════ -->
<div id="quiz" class="screen">
  <div class="quiz-navbar">
    <button class="nav-back" onclick="goHome()">‹</button>
    <div class="nav-info">
      <div class="nav-period" id="navPeriod"></div>
      <div class="nav-progress-text" id="navProgressText"></div>
    </div>
    <div class="nav-score-badge" id="navScore">0 / 0</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="quiz-body">
    <div class="q-number-row">
      <div class="q-number" id="qNumber">Soru 1</div>
      <div class="q-period-tag" id="qPeriodTag"></div>
    </div>
    <div class="question-card">
      <div class="question-text" id="questionText"></div>
    </div>
    <div class="options-list" id="optionsList"></div>
    <div class="explanation-card" id="explanationCard">
      <div class="explanation-label">💡 Doğru Cevap</div>
      <div class="explanation-text" id="explanationText"></div>
    </div>
  </div>
  <div class="next-btn-wrap">
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Sonraki Soru →</button>
  </div>
</div>

<!-- ═══════════════ RESULT SCREEN ═══════════════ -->
<div id="result" class="screen">
  <div class="result-header">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">Tebrikler!</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
  </div>
  <div class="result-score-row">
    <div class="score-box">
      <div class="score-box-val score-pct" id="scorePct">—</div>
      <div class="score-box-label">Başarı</div>
    </div>
    <div class="score-box">
      <div class="score-box-val score-correct" id="scoreCorrect">—</div>
      <div class="score-box-label">Doğru</div>
    </div>
    <div class="score-box">
      <div class="score-box-val score-wrong" id="scoreWrong">—</div>
      <div class="score-box-label">Yanlış</div>
    </div>
  </div>
  <div class="result-actions">
    <button class="btn-primary" id="retryBtn" onclick="retryQuiz()">Tekrar Dene</button>
    <button class="btn-secondary" onclick="goHome()">Ana Menüye Dön</button>
  </div>
  <div class="review-list" id="reviewList"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  QUESTION BANK
// ═══════════════════════════════════════════════════════
const PERIODS = [
  { id: 'p1950', name: '1950–1960 Dönemi', icon: '🏛️', color: '#5856D6', bg: 'rgba(88,86,214,0.18)' },
  { id: 'p1960', name: '1960–1970 Dönemi', icon: '🌐', color: '#007AFF', bg: 'rgba(0,122,255,0.18)' },
  { id: 'p1970', name: '1970–1980 Dönemi', icon: '✈️', color: '#FF9500', bg: 'rgba(255,149,0,0.18)' },
  { id: 'p1980', name: '1980–1989 Dönemi', icon: '🛡️', color: '#34C759', bg: 'rgba(52,199,89,0.18)' },
  { id: 'p1990', name: '1990 Sonrası',      icon: '🌍', color: '#AF52DE', bg: 'rgba(175,82,222,0.18)' },
  { id: 'all',   name: 'Tüm Sorular',       icon: '⭐', color: '#fff',   bg: 'transparent', isAll: true },
];

const QUESTIONS = [
  // ── 1950–1960 ──────────────────────────────────────────────────────────
  { period:'p1950', q:'II. Dünya Savaşı sonrası ABD ile SSCB arasında başlayan çatışma hangi kavramla adlandırılır?', correct:'Soğuk Savaş', wrong:['Birinci Dünya Savaşı','Kore Savaşı','Süveyş Krizi','Berlin Krizi'] },
  { period:'p1950', q:'1947 yılında ilan edilen Truman Doktrini\'nin temel amacı nedir?', correct:'Komünizm tehdidine karşı askeri ve ekonomik yardım sağlamak', wrong:['Avrupa\'yı ekonomik olarak kalkındırmak','NATO\'yu kurmak','Kore\'ye müdahale etmek','SSCB ile antlaşma imzalamak'] },
  { period:'p1950', q:'Marshall Planı hangi yıllar arasında Truman Doktrini ile birlikte uygulanmıştır?', correct:'1948–1951', wrong:['1945–1948','1950–1953','1952–1955','1946–1950'] },
  { period:'p1950', q:'Marshall Planı kaç ülkeyi kapsıyordu?', correct:'16 ülke', wrong:['12 ülke','20 ülke','8 ülke','24 ülke'] },
  { period:'p1950', q:'NATO hangi yıl kurulmuştur?', correct:'1949', wrong:['1945','1951','1947','1953'] },
  { period:'p1950', q:'14 Mayıs 1950 seçimleriyle iktidarı hangi parti devraldı?', correct:'Demokrat Parti (DP)', wrong:['Cumhuriyet Halk Partisi','Millet Partisi','Adalet Partisi','Türkiye Partisi'] },
  { period:'p1950', q:'Türkiye, NATO\'ya ilk başvurusunu hangi tarihte yaptı?', correct:'1950', wrong:['1949','1951','1952','1948'] },
  { period:'p1950', q:'Türkiye\'nin ilk NATO üyelik başvurusunu yapan hükümet hangisidir?', correct:'Şemsettin Günaltay Hükümeti', wrong:['Adnan Menderes Hükümeti','İsmet İnönü Hükümeti','Celal Bayar Hükümeti','Refik Şevket İnce Hükümeti'] },
  { period:'p1950', q:'Türkiye\'nin ilk NATO başvurusunun reddedilmesinin gerekçesi neydi?', correct:'Yetersiz demokrasi', wrong:['Ekonomik yetersizlik','Askeri zayıflık','Coğrafi konum uygunsuzluğu','Komünist tehdidin bulunmaması'] },
  { period:'p1950', q:'NATO\'nun Türkiye ve Yunanistan\'ın katılımını onayladığı toplantı hangisidir?', correct:'Ottawa\'da 15–21 Eylül 1951 toplanan NATO Bakanlar Konseyi', wrong:['Londra Konferansı 1950','Paris Zirvesi 1952','BM Güvenlik Konseyi 1951','Brüksel Konferansı 1951'] },
  { period:'p1950', q:'Türkiye\'nin NATO üyeliğine muhalefet eden ülke hangisidir?', correct:'İngiltere', wrong:['Fransa','ABD','Almanya','Belçika'] },
  { period:'p1950', q:'Türkiye ve Yunanistan NATO\'ya hangi yılda resmen kabul edilmiştir?', correct:'1952', wrong:['1950','1951','1953','1954'] },
  { period:'p1950', q:'Kore Savaşı\'nın Türkiye\'nin NATO üyeliğine etkisi ne olmuştur?', correct:'NATO\'nun kapılarını Türkiye\'ye açmıştır', wrong:['Türkiye\'nin başvurusunu geciktirmiştir','Türkiye\'yi SSCB\'ye yaklaştırmıştır','NATO üyeliğini tamamen engellemiştir','Türkiye\'ye ekonomik ambargo uygulanmasına yol açmıştır'] },
  { period:'p1950', q:'1953 yılında ABD ve NATO\'nun ilan ettiği doktrin hangisidir?', correct:'Kitlesel Karşılık Doktrini', wrong:['Truman Doktrini','Eisenhower Doktrini','Marshall Planı','Esnek Karşılık Doktrini'] },
  { period:'p1950', q:'Kitlesel Karşılık Doktrini\'ni kim öncülük ederek ilan etti?', correct:'ABD Başkanı Dwight D. Eisenhower', wrong:['ABD Başkanı Harry Truman','ABD Başkanı John F. Kennedy','ABD Başkanı Lyndon Johnson','ABD Başkanı Richard Nixon'] },
  { period:'p1950', q:'Kitlesel Karşılık Doktrini\'ne göre SSCB ile bir çatışmada ne kullanılacaktı?', correct:'Nükleer silahlar', wrong:['Konvansiyonel kara kuvvetleri','Deniz ablukası','Biyolojik silahlar','Casusluk ağı'] },
  { period:'p1950', q:'ABD\'nin Batı ittifakını sarsan Sputnik uydusu hangi ülke tarafından fırlatıldı?', correct:'Sovyetler Birliği', wrong:['ABD','Çin','İngiltere','Fransa'] },

//  STATE
// ═══════════════════════════════════════════════════════
let currentPeriod = null;
let questions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let shuffledOptions = [];
let history = [];

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function countFor(pid) {
  if (pid === 'all') return QUESTIONS.length;
  return QUESTIONS.filter(q => q.period === pid).length;
}

function buildHome() {
  const container = document.getElementById('periodCards');
  container.innerHTML = '';
  PERIODS.forEach(p => {
    const cnt = countFor(p.id);
    const card = document.createElement('div');
    card.className = 'period-card' + (p.isAll ? ' all-card' : '');
    card.onclick = () => startQuiz(p.id);
    card.innerHTML = `
      <div class="period-icon" style="background:${p.bg}; color:${p.color}; ${p.isAll ? 'background:rgba(255,255,255,0.18)' : ''}">${p.icon}</div>
      <div class="period-info">
        <div class="period-name">${p.name}</div>
        <div class="period-count" style="color:${p.isAll ? 'rgba(255,255,255,0.6)' : ''}">${cnt} soru</div>
      </div>`;
    container.appendChild(card);
  });
}

function startQuiz(periodId) {
  currentPeriod = periodId;
  const pool = periodId === 'all' ? [...QUESTIONS] : QUESTIONS.filter(q => q.period === periodId);
  questions = shuffle(pool);
  currentIndex = 0; correctCount = 0; wrongCount = 0;
  history = [];
  const p = PERIODS.find(x => x.id === periodId);
  document.getElementById('navPeriod').textContent = p.name;
  showScreen('quiz');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('explanationCard').classList.remove('show');

  const q = questions[currentIndex];
  const total = questions.length;
  const p = PERIODS.find(x => x.id === q.period);

  document.getElementById('qNumber').textContent = `Soru ${currentIndex + 1}`;
  document.getElementById('qPeriodTag').textContent = p.name;
  document.getElementById('navProgressText').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('navScore').textContent = `✓ ${correctCount}`;
  document.getElementById('progressBar').style.width = `${(currentIndex / total) * 100}%`;
  document.getElementById('questionText').textContent = q.q;

  // Shuffle options
  const letters = ['A','B','C','D','E'];
  const allOpts = shuffle([q.correct, ...q.wrong.slice(0, 4)]);
  shuffledOptions = allOpts;

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  allOpts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.onclick = () => selectOption(i);
    btn.innerHTML = `
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt}</div>
      <div class="option-icon">${opt === q.correct ? '✓' : '✗'}</div>`;
    list.appendChild(btn);
  });
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const chosen = shuffledOptions[idx];
  const isCorrect = chosen === q.correct;
  if (isCorrect) correctCount++; else wrongCount++;

  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (shuffledOptions[i] === q.correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  // Explanation
  const expCard = document.getElementById('explanationCard');
  const expText = document.getElementById('explanationText');
  expText.textContent = isCorrect
    ? `Doğru! Cevap: "${q.correct}"`
    : `Yanlış! Doğru cevap: "${q.correct}"`;
  document.querySelector('.explanation-label').textContent = isCorrect ? '✅ Doğru Cevap' : '❌ Yanlış Cevap';
  document.querySelector('.explanation-label').style.color = isCorrect ? 'var(--green)' : 'var(--red)';
  expCard.classList.add('show');

  history.push({ q: q.q, correct: q.correct, chosen, ok: isCorrect });

  document.getElementById('navScore').textContent = `✓ ${correctCount}`;

  const nextBtn = document.getElementById('nextBtn');
  const isLast = currentIndex === questions.length - 1;
  nextBtn.textContent = isLast ? 'Sonuçları Gör 🎯' : 'Sonraki Soru →';
  nextBtn.classList.add('show');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    loadQuestion();
    document.querySelector('.quiz-body').scrollTop = 0;
  }
}

function showResult() {
  const total = questions.length;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('scorePct').textContent = `%${pct}`;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreWrong').textContent = wrongCount;

  let emoji = '😔', title = 'Tekrar Dene!';
  if (pct >= 90) { emoji = '🏆'; title = 'Mükemmel!'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'Çok İyi!'; }
  else if (pct >= 50) { emoji = '👍'; title = 'İyi Deneme!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSubtitle').textContent = `${total} sorudan ${correctCount} doğru — %${pct} başarı`;

  const p = PERIODS.find(x => x.id === currentPeriod);
  document.getElementById('retryBtn').textContent = `"${p.name}" Tekrar Dene`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = `<div class="review-header">Soru Özeti</div>`;
  history.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="review-icon">${h.ok ? '✅' : '❌'}</div>
      <div>
        <div class="review-q">${i+1}. ${h.q}</div>
        <div class="review-ans ${h.ok ? 'ok' : 'no'}">${h.ok ? '✓ ' + h.correct : '✗ ' + h.chosen + ' → ' + h.correct}</div>
      </div>`;
    reviewList.appendChild(div);
  });

  showScreen('result');
}

function retryQuiz() { startQuiz(currentPeriod); }

function goHome() { showScreen('home'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

buildHome();
</script>
</body>
</html>
